:root { --bg: #09090C; --cream: #EEE4D3; --muted: #8F8A9C; --red: #D3141C; --lav: #B69CE6; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: radial-gradient(60vw 60vh at 50% 40%, #16121f 0%, transparent 70%), var(--bg);
  color: var(--cream); font-family: "Hanken V", system-ui, sans-serif;
  display: grid; place-items: center; text-align: center; padding: 24px 16px;
  -webkit-font-smoothing: antialiased;
}
.mark { width: 42px; color: var(--red); margin: 0 auto 28px; display: block; }
h1 {
  font-family: "Bodoni V", Didot, Georgia, serif; font-style: italic; font-weight: 500;
  font-variation-settings: "opsz" 24; -webkit-text-stroke: .01em currentColor;
  font-size: clamp(120px, 26vw, 260px); line-height: .8; letter-spacing: -.04em; margin: 0;
}
.drip { display: inline-block; width: .13em; height: .42em; margin-left: .015em; color: var(--red); vertical-align: -.33em; }
.drip path:first-child { transform-origin: 50% 0; animation: drip 2.4s .3s cubic-bezier(.2,.7,.1,1) both; }
@keyframes drip { from { transform: scaleY(.25); } to { transform: none; } }
p { margin: 34px auto 0; max-width: 30ch; font-family: "Bodoni V", Georgia, serif; font-style: italic;
  font-variation-settings: "opsz" 16; font-size: clamp(24px, 3vw, 32px); line-height: 1.25; }
.sub { font-family: inherit; font-style: normal; color: var(--muted); font-size: 16px; margin-top: 14px; max-width: 44ch; }
a.back { display: inline-block; margin-top: 40px; color: var(--cream); text-decoration: none; font-size: 16px;
  padding: 12px 22px; border: 1px solid rgba(238,228,211,.25); border-radius: 999px; transition: border-color .3s, color .3s; }
a.back:hover, a.back:focus-visible { border-color: var(--red); color: var(--lav); outline: none; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
